version: '3.8'

x-laravel-environment: &laravel-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY obrigatoria}
  APP_URL: ${APP_URL:?APP_URL obrigatoria}
  # Assina os tokens anti-CSRF (double-submit HMAC) e as URLs de
  # /api/storage/object. Sem ela o storage falha fechado (403/503) e o app
  # registra erro crítico no boot — por isso a obrigatoriedade aqui é explícita.
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatoria no .env (>= 16 caracteres)}
  DB_CONNECTION: pgsql
  DB_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_URL: ${REDIS_URL:-}
  REDIS_HOST: ${REDIS_HOST:-nevapro_redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_QUEUE_RETRY_AFTER: "3600"
  LOG_CHANNEL: stderr

services:
  # Cache compartilhado, sessões Laravel e filas.
  nevapro_neva-redis:
    image: redis:7-alpine
    container_name: nevapro_neva-redis
    environment:
      # Senha opcional: definida REDIS_PASSWORD no .env, o Redis passa a exigir
      # AUTH (o app manda a mesma variável). Sem ela, o comportamento continua
      # exatamente o de antes — porta publicada só em 127.0.0.1 e rede interna.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes --appendfsync everysec; fi"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Só localhost: Redis não tem senha — expor na VPS permitiria acesso anônimo.
      - "127.0.0.1:6381:6379"
    volumes:
      - redis_data:/data
    networks:
      neva_network:
        aliases:
          - nevapro_redis
          - nevapro_neva-redis
    restart: always

  # PostgreSQL (dominio + dados da aplicacao)
  # Least privilege (passo de operação, exige ação no banco): o app conecta hoje
  # como superusuário 'postgres' via DATABASE_URL. Para reduzir o impacto de um
  # SQL injection/vazamento de credencial, crie um papel só da aplicação:
  #   CREATE ROLE nevapro_app LOGIN PASSWORD '<senha forte>';
  #   GRANT CONNECT ON DATABASE nevapro TO nevapro_app;
  #   GRANT USAGE ON SCHEMA public TO nevapro_app;
  #   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO nevapro_app;
  #   GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO nevapro_app;
  # e depois troque o usuário no DATABASE_URL. (Necessário para migrations DDL:
  # rodar `php artisan migrate` como o dono do schema.)
  postgres:
    image: postgres:16-alpine
    container_name: nevapro_neva-sql
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Segredo vem do .env (não versionar credencial em texto plano).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria no .env}
      POSTGRES_DB: nevapro
    ports:
      # Só localhost: backup/acesso via túnel, sem expor o banco na internet.
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      neva_network:
        aliases:
          - nevapro_postgresql
          - nevapro_neva-sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nevapro"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Reverse Proxy, static frontend e FastCGI para a API Laravel.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_MAINTENANCE_MODE: ${VITE_MAINTENANCE_MODE:-false}
    image: neva-web:latest
    container_name: neva_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - neva_network
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    restart: always

  # Certbot (Let's Encrypt)
  certbot:
    image: certbot/certbot:latest
    container_name: neva_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - neva_network
    restart: "no"

  # Laravel PHP-FPM API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: neva-laravel-api:latest
    env_file:
      - .env
    environment:
      <<: *laravel-environment
      SESSION_SECURE_COOKIE: "true"
    networks:
      - neva_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000);exit($s?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      nevapro_neva-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

  # Laravel scheduler
  scheduler:
    image: neva-laravel-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    environment:
      <<: *laravel-environment
    command: ["php", "artisan", "schedule:work"]
    networks:
      - neva_network
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      nevapro_neva-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

  # Laravel queue worker
  worker:
    image: neva-laravel-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    environment:
      <<: *laravel-environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=3500"]
    networks:
      - neva_network
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      nevapro_neva-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

networks:
  neva_network:
    driver: bridge

volumes:
  laravel_storage:
  redis_data:
  pg_data:
