version: '3.8'

x-laravel-environment: &laravel-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY obrigatoria}
  APP_URL: ${APP_URL:?APP_URL obrigatoria}
  DB_CONNECTION: pgsql
  DB_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  CACHE_STORE: database
  SESSION_DRIVER: array
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: "3600"
  LOG_CHANNEL: stderr

services:
  # Reverse Proxy, static frontend and TLS termination
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_MAINTENANCE_MODE: ${VITE_MAINTENANCE_MODE:-false}
    image: neva-web:latest
    container_name: neva_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro # Certificados emitidos pelo container certbot
      - ./certbot/www:/var/www/certbot:ro # Webroot para validação ACME
    networks:
      - neva_network
    depends_on:
      api:
        condition: service_healthy
    restart: always

  # Certbot (Let's Encrypt) — emite e renova os certificados SSL.
  # Executado sob demanda: docker compose run --rm certbot certonly|renew
  certbot:
    image: certbot/certbot:latest
    container_name: neva_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - neva_network
    restart: "no"

  # Laravel PHP-FPM API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: neva-laravel-api:latest
    env_file:
      - .env
    environment:
      <<: *laravel-environment
      SESSION_SECURE_COOKIE: "true"
    networks:
      - neva_network
    healthcheck:
      test: ["CMD", "php", "-r", "$$s=@fsockopen('127.0.0.1',9000);exit($s?0:1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

  # Laravel scheduler replaces the former HTTP-calling cron container.
  scheduler:
    image: neva-laravel-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    environment:
      <<: *laravel-environment
    command: ["php", "artisan", "schedule:work"]
    networks:
      - neva_network
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

  # Executes Laravel queued emails, notifications and database backups.
  worker:
    image: neva-laravel-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    environment:
      <<: *laravel-environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=3500"]
    networks:
      - neva_network
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: always

networks:
  neva_network:
    driver: bridge

volumes:
  laravel_storage:
