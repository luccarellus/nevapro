# Nginx do stack NevaPro (Docker Compose / EasyPanel "Docker Compose").
# TLS/HTTPS: na VPS direta, use o ./deploy.sh ssl (Certbot) e adicione um
# bloco server 443 com ssl_certificate. No EasyPanel, o TLS é terminado no
# proxy do painel, que encaminha para a porta 80 deste container — este
# arquivo já está pronto para esse cenário.

server {
    listen 80 default_server;
    # Placeholder trocado pelo domínio real via ./deploy.sh setup (ou manualmente).
    server_name seu-dominio.com;

    # Webroot para validação ACME do Certbot (não redirecionar)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;

    # Headers de segurança (equivalente ao helmet da antiga API Express).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Laravel — PHP-FPM, rate limit adicional no proxy
    # Sem ^~: permite que a regex \.php$ abaixo seja avaliada e encaminhe ao FPM.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        internal;
        include fastcgi_params;
        fastcgi_pass neva_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
        # Nunca expor a versão do PHP mesmo que o ini seja esquecido no build.
        fastcgi_hide_header X-Powered-By;
    }

    # Assets versionados pelo Vite.
    # (add_header aqui substitui os do server: redeclara os de segurança.)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Frontend estático e fallback SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
