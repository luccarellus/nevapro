# Nginx do stack NevaPro (Docker Compose / EasyPanel "Docker Compose").
# TLS/HTTPS: na VPS direta, use o ./deploy.sh ssl (Certbot) e adicione um
# bloco server 443 com ssl_certificate. No EasyPanel, o TLS é terminado no
# proxy do painel, que encaminha para a porta 80 deste container — este
# arquivo já está pronto para esse cenário.

server {
    listen 80 default_server;
    # Placeholder trocado pelo domínio real via ./deploy.sh setup (ou manualmente).
    server_name seu-dominio.com;

    # Webroot para validação ACME do Certbot (não redirecionar)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;

    # Headers de segurança (equivalente ao helmet da antiga API Express).
    # ATENÇÃO: um add_header dentro de um location SUBSTITUI todos os herdados
    # do server — por isso os blocos /assets/ e de favicon repetem esta lista.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP estrita: apenas o próprio app + reCAPTCHA (Google) e Clarity (analytics
    # consentido). Sem scripts inline — o tema inicial vive em /theme-init.js e o
    # registro do service worker em /registerSW.js. 'unsafe-inline' só em
    # style-src (o React usa style attributes). Se algo for bloqueado, o console
    # do navegador aponta a diretiva — ajuste aqui e faça o redeploy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # API Laravel — PHP-FPM, rate limit adicional no proxy
    # Sem ^~: permite que a regex \.php$ abaixo seja avaliada e encaminhe ao FPM.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        internal;
        include fastcgi_params;
        fastcgi_pass neva_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
        # Nunca expor a versão do PHP mesmo que o ini seja esquecido no build.
        fastcgi_hide_header X-Powered-By;
    }

    # Assets versionados pelo Vite.
    # (add_header aqui substitui os do server: redeclara os de segurança.)
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        access_log off;
    }

    # Favicons/ícones: cache curto + revalidação (evita favicon antigo
    # persistindo no navegador após troca de assets).
    location ~* ^/(favicon\.(ico|svg|png)|apple-touch-icon\.png|manifest\.webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        access_log off;
    }

    # Frontend estático e fallback SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
