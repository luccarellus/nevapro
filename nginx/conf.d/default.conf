# ATENÇÃO: substitua "seu-dominio.com" pelo seu domínio real
# (o container do Certbot deve gerar os certificados nesse domínio).
server {
    listen 80;
    server_name seu-dominio.com;
    root /usr/share/nginx/html;

    # Webroot para validação ACME do Certbot (não redirecionar)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    http2 on;
    server_name seu-dominio.com;
    root /usr/share/nginx/html;

    # SSL Config (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # Security Headers (LGPD & OWASP)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API Laravel — PHP-FPM, rate limit adicional no proxy
    location ^~ /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass neva_php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
    }

    # Assets versionados pelo Vite.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Frontend estático e fallback SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
