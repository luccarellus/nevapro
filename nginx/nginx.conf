user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs de acesso desativados: I/O de disco zero em hot path
    access_log off;

    # ===== Performance de transferência =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ===== Gzip (API JSON + estáticos) =====
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/vnd.api+json
        image/svg+xml
        font/woff2;

    # ===== Laravel PHP-FPM upstream =====
    upstream neva_php {
        server api:9000 max_fails=3 fail_timeout=30s;
    }

    # Definir limit_req_zone no nível HTTP (Correto)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    include /etc/nginx/conf.d/*.conf;
}
