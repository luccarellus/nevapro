user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Não expor a versão do nginx em respostas de erro.
    server_tokens off;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Uploads (avatar até 2 MB, materiais até 5 MB no Laravel — o default de
    # 1 MB do nginx devolvia 413 para arquivos maiores).
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/vnd.api+json
        image/svg+xml
        font/woff2;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Headers de segurança (equivalente ao helmet da antiga API Express).
        # ATENÇÃO: um add_header dentro de um location SUBSTITUI todos os herdados
        # do server — por isso os blocos /assets/ e de favicon repetem a lista.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # CSP estrita: apenas o próprio app + reCAPTCHA (Google) e Clarity
        # (analytics consentido). Sem scripts inline — o tema inicial vive em
        # /theme-init.js e o registro do service worker em /registerSW.js.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 60s;
            fastcgi_hide_header X-Powered-By;
        }

        # (add_header aqui substitui os do server: redeclara os de segurança.)
        location ^~ /assets/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            access_log off;
        }

        # Favicons/ícones: cache curto + revalidação. Sem isso o navegador
        # guarda o favicon antigo (ou o 404) por tempo indeterminado — queixa
        # clássica de "fiz várias configurações e não aparece".
        location ~* ^/(favicon\.(ico|svg|png)|apple-touch-icon\.png|manifest\.webmanifest)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://www.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://www.google.com https://*.clarity.ms; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
