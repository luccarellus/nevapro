name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio: o workflow só precisa ler o repositório.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ci_secret_with_at_least_32_characters!!
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (frontend + server bundle)
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, zip
          coverage: none

      # composer.lock versionado: instala exatamente o que roda em produção.
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      # Falha o build se alguma dependência instalada tiver advisory conhecido.
      - name: Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Prepare environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        working-directory: backend
        run: vendor/bin/pint --test

      # Os testes usam phpunit.xml (sqlite em memória) — não tocam o Postgres.
      - name: Tests (PHPUnit)
        working-directory: backend
        run: php artisan test
