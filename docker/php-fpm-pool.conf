; PHP-FPM pool tuning para produção NevaPro
; pm=static elimina o overhead de fork/kill de workers sob carga variável.
; pm.max_children=10 cobre picos de tráfego sem pressionar RAM (cada worker ~30 MB).
; pm.max_requests limita memory leaks reiniciando workers periodicamente.
[www]
pm = static
pm.max_children = 10
pm.max_requests = 500
request_terminate_timeout = 60s
; Log requests lentos (>2s) para diagnóstico
slowlog = /proc/self/fd/2
request_slowlog_timeout = 2s
