<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="alternate icon" type="image/png" href="/favicon.png?v=2" />
  <link rel="shortcut icon" href="/favicon.svg?v=2" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neva PRO" />
  <link rel="apple-touch-icon" href="/favicon.png?v=2" />
  <title>Neva PRO</title>
  <script>
    (function () {
      // Aplica o tema ANTES do primeiro paint para eliminar o flash/delay no F5
      var theme = localStorage.getItem('neva_custom_theme') || 'default';
      var isDark = localStorage.getItem('neva_dark_mode');
      var isDarkMode = isDark !== 'false'; // default: true

      var activeTheme = theme;
      if (theme === 'default') {
        activeTheme = isDarkMode ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', activeTheme);

      if (isDarkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      var bgColors = {
        'dark': '#191a32',
        'light': '#f4f6ff',
        'cyberpunk': isDarkMode ? '#08070d' : '#faf8fc',
        'eighties': isDarkMode ? '#080313' : '#fff3fb',
        'forest': isDarkMode ? '#050806' : '#f4f9f6',
        'dracula': isDarkMode ? '#11111b' : '#eff1f5',
        'neva': isDarkMode ? '#060b0d' : '#f0f8fa',
        'minimalist': isDarkMode ? '#09090b' : '#fafafa',
        'retro': isDarkMode ? '#0c0805' : '#f4ecd8'
      };

      var themeMeta = document.getElementById('theme-color-meta');
      if (!themeMeta) {
        themeMeta = document.createElement('meta');
        themeMeta.name = 'theme-color';
        themeMeta.id = 'theme-color-meta';
        document.head.appendChild(themeMeta);
      }
      themeMeta.setAttribute('content', bgColors[activeTheme] || '#060a12');
    })();
  </script>
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "wxb24lvio4");
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
