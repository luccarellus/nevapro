<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png?v=1" />
  <link rel="shortcut icon" href="/favicon.png?v=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Neva Pro" />
  <link rel="apple-touch-icon" href="/favicon.png?v=1" />
  <title>Neva Pro</title>
  <script>
    (function () {
      // Aplica o tema ANTES do primeiro paint para eliminar o flash/delay no F5
      var theme = localStorage.getItem('neva_custom_theme');
      var isDark = localStorage.getItem('neva_dark_mode');
      var isDarkMode = isDark !== 'false'; // default: true

      if (theme && theme !== 'default') {
        document.documentElement.setAttribute('data-theme', theme);
      } else {
        document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
      }

      if (isDarkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <script type="text/javascript">
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
      t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, "clarity", "script", "wxb24lvio4");
  </script>
</head>
